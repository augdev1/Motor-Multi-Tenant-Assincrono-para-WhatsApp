[project]
name = "ia-wpp"
version = "0.1.0"
description = "Motor Multi-Tenant Assíncrono para WhatsApp com LangGraph, RAG e Evolution API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.1.1",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.5",
    "redis>=5.1.0",
    "httpx>=0.27.2",
    "langgraph>=0.2.34",
    "langchain-core>=0.3.10",
    "langchain-google-genai>=2.0.1",
    "numpy>=1.26.0",
    "qrcode>=8.2",
    "pillow>=13.0.0",
    "nemoguardrails>=0.24.1",
    "alembic>=1.20.1",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "fakeredis>=2.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = "test_*.py"
